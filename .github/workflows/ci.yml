name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Teste backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contahub
          POSTGRES_PASSWORD: contahub
          POSTGRES_DB: contahub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://contahub:contahub@localhost:5432/contahub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Migrarea corespunde modelelor
        env:
          DATABASE_URL: postgresql+psycopg://contahub:contahub@localhost:5432/contahub_test
        run: alembic check

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
