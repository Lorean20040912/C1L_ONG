<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContaHub ONG — prototip</title>
<style>
:root{
  --side:#FBF3D5; --side-active:#F3DE8A; --top:#F7E7A6; --btn:#F5D34B; --btn-h:#EBC52E;
  --border:#C8C8C8; --line:#E4E4E4; --link:#2B5DA8; --green:#3C8D40; --red:#C0392B;
  --sel:#FCEFB4; --ai:#FFF3B0; --ai-b:#E0B400; --text:#333; --muted:#777; --bg:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px "Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--link);cursor:pointer}
button{font:inherit;cursor:pointer}
#app{display:grid;grid-template-rows:40px 34px 1fr;grid-template-columns:220px 1fr;height:100vh}
#top{grid-column:1/-1;background:var(--top);display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid #E2CF7C}
#top .logo{font-weight:700;font-size:16px;letter-spacing:.2px}
#top .logo b{color:var(--red)}
#top select{font:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:3px;background:#fff}
#top .search{margin-left:auto;display:flex;gap:6px;align-items:center}
#top .search input{width:280px;padding:4px 8px;border:1px solid var(--border);border-radius:3px}
#top .icons{display:flex;gap:12px;color:#555}
#side{grid-row:2/4;background:var(--side);border-right:1px solid #E8DBA8;overflow:auto;padding-top:6px}
#side div{padding:8px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
#side div:hover{background:#F7E9B4}
#side div.active{background:var(--side-active);font-weight:600}
#side .ico{width:18px;text-align:center;color:#6b5a1a}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:0 6px;border-bottom:1px solid var(--border);background:#F3F3F3;overflow-x:auto}
.tab{padding:6px 12px;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;background:#E9E9E9;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab.active{background:#fff;border-bottom:2px solid var(--green);font-weight:600}
.tab .x{color:#888;font-weight:400}
.tab .x:hover{color:var(--red)}
#main{overflow:auto;padding:12px 18px 30px}
h1{font-size:22px;font-weight:400;margin:4px 0 10px;display:flex;gap:12px;align-items:center}
h2{color:var(--green);font-size:17px;margin:14px 0 8px}
.nav-arrows{display:inline-flex;border:1px solid var(--border);border-radius:3px}
.nav-arrows span{padding:2px 9px;color:#666}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.b{padding:5px 12px;border:1px solid var(--border);background:#fff;border-radius:3px}
.b:hover{background:#F6F6F6}
.b.primary{background:var(--btn);border-color:#D9B52A;font-weight:600}
.b.primary:hover{background:var(--btn-h)}
.bar .sp{flex:1}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{background:#F2F2F2;text-align:left;font-weight:400;color:#555;border:1px solid var(--line);padding:5px 8px;position:sticky;top:0}
.grid td{border:1px solid var(--line);padding:4px 8px;height:26px}
.grid tr:hover td{background:#FAFAFA}
.grid tr.sel td{background:var(--sel)}
.grid td.num,.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;width:14px;text-align:center}
.st.ok{color:var(--green)} .st.no{color:#aaa} .st.del{color:var(--red)}
.cal{border-collapse:collapse;width:100%}
.cal td{padding:10px 8px;border-bottom:1px solid #F0F0F0;vertical-align:top}
.cal tr.soon td{background:#FFF7D1;outline:2px solid #F2C94C;outline-offset:-2px}
.late{color:var(--red)} .ok{color:var(--green)}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.orgbar{background:#FBEFC0;padding:8px 10px;display:flex;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.seg span{padding:4px 12px;background:#fff;cursor:pointer}
.seg span.on{color:var(--green);font-weight:600}
.card{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px}
.meter{height:8px;background:#EEE;border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.over{background:var(--red)}
.form{display:grid;grid-template-columns:150px 1fr 150px 1fr;gap:8px 12px;align-items:center;max-width:980px;margin-bottom:12px}
.form label{color:#555;text-align:right}
.form input,.form select{font:inherit;padding:4px 7px;border:1px solid var(--border);border-radius:3px;width:100%;background:#fff}
.ref{display:flex}
.ref input{border-radius:3px 0 0 3px}
.ref span{border:1px solid var(--border);border-left:none;padding:4px 7px;border-radius:0 3px 3px 0;background:#F6F6F6;color:#666;cursor:pointer}
.ai input{background:var(--ai);border-color:var(--ai-b)}
.conf{font-size:11px;color:#9a7b00;margin-left:6px;white-space:nowrap}
.inner-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:8px 0}
.inner-tabs span{padding:5px 12px;cursor:pointer;border:1px solid transparent;border-bottom:none}
.inner-tabs span.on{border-color:var(--border);background:#fff;border-radius:3px 3px 0 0;margin-bottom:-1px;font-weight:600}
.totals{display:flex;justify-content:flex-end;gap:24px;margin-top:8px;font-size:14px}
.totals b{font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(320px,1fr) 1.2fr;gap:18px}
.scan{border:1px solid var(--border);background:#FAFAFA;padding:16px;font:12px "Courier New",monospace;min-height:520px;position:relative}
.scan .hl{background:rgba(245,211,75,.45)}
.scan .stamp{position:absolute;right:18px;top:16px;border:2px solid #7a9;color:#7a9;padding:4px 8px;transform:rotate(-8deg);font-weight:700}
.hint{background:#EEF4FB;border:1px solid #CFE0F3;padding:8px 10px;border-radius:3px;margin:8px 0;font-size:13px}
.warn{background:#FDECEA;border:1px solid #F5C6C0}
.navgroups{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:20px}
.navgroups ul{list-style:none;padding:0;margin:0}
.navgroups li{padding:5px 0}
.navgroups h3{font-size:14px;color:var(--green);margin:0 0 6px}
.new{font-size:10px;background:var(--green);color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.rep td.cell{cursor:pointer;text-decoration:underline dotted #999}
.rep td.cell:hover{background:var(--sel)}
.drill{margin-top:12px}
.kbd{font:11px monospace;border:1px solid #ccc;border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fafafa}
.footer-note{color:var(--muted);font-size:12px;margin-top:18px}
#app.with-ai{grid-template-columns:220px 1fr 360px}
#assist{display:none;grid-row:2/4;grid-column:3;border-left:1px solid var(--border);background:#FCFCFA;flex-direction:column;min-height:0}
#app.with-ai #assist{display:flex}
#assist .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600}
#assist .msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.msg{padding:8px 10px;border-radius:6px;max-width:92%;line-height:1.4}
.msg.u{background:#FFF3C4;align-self:flex-end}
.msg.a{background:#fff;border:1px solid var(--line)}
.msg .src{font-size:11px;color:var(--muted);margin-top:4px}
.prop{border:1px solid #CFE0F3;background:#F3F8FD;border-radius:6px;padding:8px 10px;font-size:13px}
.prop .acts{display:flex;gap:6px;margin-top:6px}
.prop.done{border-color:#BFE3C2;background:#F1FAF2}
#assist .in{border-top:1px solid var(--line);padding:8px;display:flex;gap:6px}
#assist .in input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:3px;font:inherit}
.ai-btn{background:#fff;border:1px solid #D9B52A;border-radius:3px;padding:3px 10px;font-weight:600}
.steps{list-style:none;padding:0;margin:0;max-width:900px}
.steps li{display:grid;grid-template-columns:28px 1fr 160px 220px;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid #F0F0F0}
.steps .ic{font-weight:700;text-align:center}
.wiz{display:flex;gap:0;margin:6px 0 14px}
.wiz span{padding:6px 14px;background:#F2F2F2;border:1px solid var(--line);font-size:13px}
.wiz span.on{background:var(--btn);font-weight:600}
.wiz span.ok{background:#E6F3E7}
.tree{font:13px "Segoe UI",Arial;line-height:1.9;border:1px solid var(--line);padding:10px 14px;border-radius:4px;background:#FCFCFC}
.tree .f{color:#6b5a1a}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:#EEE;margin-left:4px}
.tag.fa{background:#E3EEFB} .tag.omv{background:#FCEBD7} .tag.mat{background:#E9F5E5} .tag.srv{background:#F0E8F7}
@media (max-width:900px){#app,#app.with-ai{grid-template-columns:56px 1fr}#assist{display:none!important}#side div span.t{display:none}.cols,.split{grid-template-columns:1fr}.form{grid-template-columns:110px 1fr}#top .search input{width:120px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span>☰</span>
    <span class="logo">Conta<b>Hub</b> ONG</span>
    <select id="org"><option>AO „CARTERA”</option><option>AO „Exemplu Verde”</option><option>Fundația „Pilot”</option></select>
    <div class="search"><input placeholder="Căutare în program și legislație (Ctrl+F)"></div>
    <button class="ai-btn" onclick="toggleAI()" title="Asistentul AI">✦ Asistent</button>
    <div class="icons" title="Notificări · Istoric · Favorite"><span>🔔</span><span>⏱</span><span>☆</span><span>Contabil-șef ▾</span></div>
  </div>
  <div id="side"></div>
  <div id="tabs"></div>
  <div id="main"></div>
  <div id="assist">
    <div class="hd"><span>✦ Asistent AI</span><a onclick="toggleAI()">×</a></div>
    <div class="msgs" id="msgs"></div>
    <div class="in"><input id="ask" placeholder="Scrie ce ai nevoie… (ex. „mută butonul Dt/Kt la început”)" onkeydown="if(event.key==='Enter')send()"><button class="b primary" onclick="send()">➤</button></div>
  </div>
</div>

<script>
/* ───────────── date de exemplu (fictive) ───────────── */
const SECTIONS = [
  ['home','≡','Principal'],['head','↗','Conducătorului'],['bank','₿','Bancă și casă'],['sales','⬆','Vânzări'],
  ['purch','⬇','Achiziții'],['stock','▦','Depozit'],['fa','▣','Mijloace fixe și INM'],['pay','👤','Salarii și personal'],
  ['ngo','♡','Granturi și ONG'],['ops','Dt','Operațiuni'],['rep','▥','Rapoarte'],['cat','☰','Cataloage'],['adm','⚙','Administrare']
];
const NAV = {
  purch:{Documente:['Facturi primite','Plăți către persoane fizice|new','Servicii primite (acte)','Facturi de la furnizor'],
         Jurnale:['Documente scanate (AI)|new','Facturi fiscale primite'],Rapoarte:['Datorii față de furnizori','Achiziții pe granturi']},
  pay:{Documente:['Angajare','Calcul salariu','Plată către persoană fizică|new','Contracte civile|new','Cereri de scutire','Concedii medicale'],
       Rapoarte:['Stat de plată','Fișa de salariu','IPC21'],Cataloage:['Persoane fizice','Tipuri de calcul']},
  ngo:{Granturi:['Proiecte / granturi','Linii de buget','Donatori'],Documente:['Finanțare primită','Repartizarea cheltuielilor'],
       Rapoarte:['Execuția bugetului','Pachet pentru donator|new','5-CON','ONG17|new'],Setări:['Șabloane Excel ale donatorilor|new','Cerințele donatorilor|new']},
  rep:{Standard:['Balanța de verificare (OSV)','Fișa contului','Analiza contului','Cartea mare'],Fiscale:['IPC21','ONG17|new','TVA'],
       Statistice:['5-CON'],Donatori:['Raport pentru donator (Excel)|new']},
  bank:{Documente:['Ordine de plată','Încasări pe cont','Plăți din cont','Încasări numerar','Plăți numerar','Decont de avans'],Servicii:['Import extras bancar|new','Export ordine de plată','e-Factura|new','Curs BNM']},
  fa:{Documente:['Mijloace fixe (din factură)|new','Punere în funcțiune','Casare'],Servicii:['Închiderea lunii|new'],Rapoarte:['Fișa mijloacelor fixe','Amortizarea pe granturi']},
  ops:{Servicii:['Închiderea lunii|new','Operațiune manuală','Ajustarea perioadei'],Rapoarte:['Verificarea contabilității']},
  adm:{Setări:['Surse de documente (Drive / folder)|new','Profiluri bănci|new','Conexiune e-Factura|new','Utilizatori și drepturi','Personalizarea interfeței|new'],Asistent:['Regulile memorate ale asistentului|new']},
};
const CAL = [
  ['25 octombrie','5-CON trimestrul III 2026','late'],['25 octombrie','IPC21 septembrie 2026','ok'],
  ['25 noiembrie','IPC21 octombrie 2026','soon'],['25 decembrie','IPC21 noiembrie 2026',''],
  ['25 ianuarie','5-CON trimestrul IV 2026',''],['25 martie','ONG17 pentru 2026','']
];
const INVOICES = [
  {st:'ok',n:'AA0001234',d:'03.11.2026',cp:'„Birotica Plus” SRL',sum:16470.00,gr:'SOR-2026-01 / 2.1, 4.2 (MF + OMVSD + materiale)'},
  {st:'ok',n:'EF2026117',d:'05.11.2026',cp:'„Moldtelecom” SA',sum:612.40,gr:'SOR-2026-01 / 3.2 Comunicații'},
  {st:'no',n:'BB0045521',d:'10.11.2026',cp:'„Taxi Rapid” SRL',sum:350.00,gr:'— nealocat —'},
  {st:'ok',n:'AC0009870',d:'12.11.2026',cp:'„Print Expres” SRL',sum:1280.00,gr:'UE-2025-03 / 4.1 Publicații'},
  {st:'del',n:'AA0001199',d:'14.11.2026',cp:'„Birotica Plus” SRL',sum:4560.00,gr:'— dublură —'},
];
const PEOPLE = [
  {st:'ok',n:'PF-0007',d:'01.11.2026',p:'Popescu Ion',kind:'Chirie birou (FOL)',code:'FOL',gross:5000,tax:350},
  {st:'ok',n:'PF-0008',d:'05.11.2026',p:'Rusu Maria',kind:'Servicii / contract civil (PL)',code:'PL',gross:3000,tax:360},
  {st:'no',n:'PF-0009',d:'15.11.2026',p:'Ceban Vasile',kind:'Arendă teren agricol (PLs)',code:'PLs',gross:1200,tax:0},
];
const IPC = [
  ['11','SAL','Plăți salariale, art.88 CF',84200,9150,7578],['31','PL','Venituri din care se reține impozit, art.90 (contracte civile)',3000,360,''],
  ['32','PLs','Venituri scutite de reținere prealabilă, art.90',1200,0,''],['41','FOL','Locațiune de la persoane fizice, art.90¹ alin.(3)',5000,350,''],
  ['49','DON pf','Donații către persoane fizice',0,0,''],['61','','TOTAL',93400,9860,7578]
];
const fmt = v => v===''?'':Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const ST = {ok:'<span class="st ok" title="Înregistrat">✓</span>',no:'<span class="st no" title="Neînregistrat">○</span>',del:'<span class="st del" title="Marcat pentru ștergere">✕</span>'};

/* ───────────── file (tab-uri) ───────────── */
let tabs=[{id:'home',title:'Pagina inițială',fixed:true}], active='home';
function openTab(id,title){ if(!tabs.find(t=>t.id===id)) tabs.push({id,title}); active=id; render(); }
function closeTab(id,e){ if(e) e.stopPropagation(); const i=tabs.findIndex(t=>t.id===id); if(i<0||tabs[i].fixed) return;
  tabs.splice(i,1); if(active===id) active=tabs[Math.max(0,i-1)].id; render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeTab(active);
  if(e.ctrlKey && e.key==='Enter' && active.startsWith('doc')){ closeTab(active); }
  if(e.key==='Insert' && active==='list-inv'){ openTab('doc-new','Factură primită (nouă) *'); }
});

/* ───────────── ecrane ───────────── */
const SCREENS = {
  home(){
    return `<h1><span class="nav-arrows"><span>←</span><span>→</span></span> Pagina inițială</h1>
    <div class="cols"><div>
      <h2>Astăzi: 18 noiembrie, miercuri</h2>
      <div class="orgbar"><a>AO „CARTERA”</a><span class="seg"><span class="on">Sarcini</span><span>Monitor</span></span></div>
      <div class="bar" style="margin-top:6px"><a>Sarcini îndeplinite</a><span class="sp"></span><a>Setarea listei de rapoarte</a></div>
      <table class="cal">${CAL.map(([d,r,s])=>`<tr class="${s==='soon'?'soon':''}"><td style="width:150px">📄 ${d}</td>
        <td><a onclick="openTab('rep-ipc','IPC21 octombrie 2026')">${r}</a></td>
        <td style="width:170px" class="${s==='late'?'late':s==='ok'?'ok':''}">${s==='late'?'Restanță':s==='ok'?'Prezentat ✓':s==='soon'?'A rămas o săptămână':''}</td></tr>`).join('')}</table>
    </div><div>
      <h2>Documente de verificat <span class="new">AI</span></h2>
      <div class="card">3 facturi scanate și 1 ordin de plată citite automat din Google Drive.<br>
        <a onclick="openTab('doc-ai','Verificare: factura BB0045521')">Deschide prima →</a></div>
      <h2>Execuția bugetelor</h2>
      ${[['SOR-2026-01 (Fundația Soros)',62],['UE-2025-03 (Uniunea Europeană)',91],['Cotizații membri',104]].map(([g,p])=>
        `<div class="card"><a onclick="openTab('rep-budget','Execuția bugetului')">${g}</a> — ${p}%<div class="meter"><i class="${p>100?'over':''}" style="width:${Math.min(p,100)}%"></i></div>${p>100?'<div class="late" style="font-size:12px;margin-top:4px">Depășire pe linia 3.2 Comunicații</div>':''}</div>`).join('')}
      <h2>Actualizări legislative</h2>
      <div class="card">1 propunere nouă: <b>plafonul scutirii personale 2027</b> — <a>verifică și aprobă</a></div>
    </div></div>`;
  },
  section(id){
    const sec=SECTIONS.find(s=>s[0]===id); const groups=NAV[id]||{Documente:['(în lucru)']};
    return `<h1>${sec[2]}</h1><div class="navgroups">${Object.entries(groups).map(([g,items])=>`<div><h3>${g}</h3><ul>${items.map(it=>{
      const [name,flag]=it.split('|'); const target=LINK[name];
      return `<li><a onclick="${target?`openTab('${target[0]}','${target[1]}')`:''}">${name}</a>${flag?'<span class="new">nou</span>':''}</li>`}).join('')}</ul></div>`).join('')}</div>
      <p class="footer-note">Elementele marcate „nou” nu există în 1C actual.</p>`;
  },
  'list-inv'(){
    return `<h1><span class="nav-arrows"><span>←</span><span>→</span></span> Facturi primite</h1>
    <div class="bar"><button class="b primary" onclick="openTab('doc-new','Factură primită (nouă) *')">Creare</button><button class="b">Copiere</button>
      <button class="b">Înregistrare</button><button class="b" onclick="openTab('dtkt','Dt/Kt: AA0001234')">Dt/Kt</button><button class="b">Tipărire ▾</button>
      <button class="b" onclick="openTab('doc-ai','Verificare: factura BB0045521')">📥 Din Drive (AI)</button>
      <span class="sp"></span><select class="b"><option>Noiembrie 2026</option><option>Trimestrul IV</option></select><input class="b" placeholder="Căutare (Ctrl+F)"></div>
    <table class="grid"><tr><th></th><th>Număr</th><th>Data</th><th>Contrapartidă</th><th class="num">Suma, lei</th><th>Grant / linie de buget</th></tr>
    ${INVOICES.map((r,i)=>`<tr class="${i===0?'sel':''}" ondblclick="openTab('doc-inv','Factură primită ${r.n}')"><td>${ST[r.st]}</td><td>${r.n}</td><td>${r.d}</td><td>${r.cp}</td><td class="num">${fmt(r.sum)}</td><td>${r.gr}</td></tr>`).join('')}</table>
    <p class="footer-note">Dublu-click deschide documentul · <span class="kbd">Insert</span> document nou · <span class="kbd">Esc</span> închide fila</p>`;
  },
  'doc-inv'(){ return invoiceForm(false); },
  'doc-new'(){ return invoiceForm(false,true); },
  'doc-ai'(){
    return `<h1>Verificare document scanat <span class="new">AI</span></h1>
    <div class="bar"><button class="b primary" onclick="closeTab('doc-ai')">Confirmă și înregistrează</button><button class="b">Doar salvează</button><button class="b">Respinge</button>
      <span class="sp"></span><a>Deschide originalul pe Drive ↗</a></div>
    <div class="hint">Câmpurile <span style="background:var(--ai);padding:0 4px">galbene</span> au încredere sub 90% — verifică-le cu scanul din stânga. Grantul și linia de buget sunt propuse după istoricul contrapartidei.</div>
    <div class="split"><div class="scan"><div class="stamp">ACHITAT</div>
      <b>FACTURA FISCALĂ</b> Seria <span class="hl">BB</span> Nr. <span class="hl">0045521</span><br>Data: <span class="hl">10.11.2026</span><br><br>
      Furnizor: <span class="hl">„Taxi Rapid” SRL</span><br>IDNO: <span class="hl">1012600012345</span><br>IBAN: MD24AG000000022512345678<br><br>

/* ───────────── asistentul AI ───────────── */
let chat=[
  {r:'u',t:'De ce nu apare chiria de la Popescu în IPC21?'},
  {r:'a',t:'Chiria e înregistrată ca serviciu primit, nu ca plată către persoană fizică — de aceea nu are cod de venit FOL. Pot crea documentul „Plată către persoană fizică” pentru 5 000 lei cu reținerea la sursă.',src:'Codul fiscal art. 90¹ alin.(3) · instrucțiunea IPC21, codul 41'},
  {r:'p',id:'p1',t:'Creează „Plată către persoană fizică” PF-0010: Popescu Ion, chirie (FOL), 5 000,00 lei, octombrie 2026.'}];
function toggleAI(){ document.getElementById('app').classList.toggle('with-ai'); renderChat(); }
function renderChat(){
  document.getElementById('msgs').innerHTML = chat.map(m=> m.r==='p'
    ? `<div class="prop ${m.done?'done':''}"><b>Propunere</b><br>${m.t}${m.done?`<div style="margin-top:6px;color:var(--green)">✓ ${m.done}</div>`:
      `<div class="acts"><button class="b primary" onclick="apply('${m.id}')">Aplică</button><button class="b" onclick="reject('${m.id}')">Respinge</button></div>`}</div>`
    : `<div class="msg ${m.r}">${m.t}${m.src?`<div class="src">Surse: ${m.src}</div>`:''}</div>`).join('');
  const el=document.getElementById('msgs'); el.scrollTop=el.scrollHeight;
}
function apply(id){
  const p=chat.find(m=>m.id===id); if(!p) return;
  if(p.ui==='dtkt'){ UI.dtktFirst=true; p.done='Aplicat. Poți anula din Administrare → Personalizarea interfeței.'; openTab('doc-inv','Factură primită AA0001234'); }
  else if(p.ui==='label'){ UI.grantLabel='Proiect'; p.done='Aplicat pentru tine. Pentru toată organizația — aprobarea contabilului-șef.'; openTab('doc-inv','Factură primită AA0001234'); }
  else { p.done='Document PF-0010 creat ca ciornă — verifică și înregistrează.'; openTab('doc-pf','Plată PF-0010'); }
  renderChat(); render();
}
function reject(id){ chat=chat.filter(m=>m.id!==id); renderChat(); }
function send(){
  const q=document.getElementById('ask').value.trim(); if(!q) return; document.getElementById('ask').value='';
  chat.push({r:'u',t:q});
  if(/dt\/?kt/i.test(q)) chat.push({r:'a',t:'Pot muta butonul Dt/Kt la începutul barei în formularul facturii. Schimb doar setarea interfeței, nu datele.'},{r:'p',id:'p'+chat.length,ui:'dtkt',t:'Interfață: în „Factură primită”, butonul Dt/Kt primul în bara de comenzi (doar pentru tine).'});
  else if(/proiect|grant/i.test(q)) chat.push({r:'a',t:'Pot redenumi câmpul „Grant” în „Proiect” în formulare.'},{r:'p',id:'p'+chat.length,ui:'label',t:'Interfață: eticheta „Grant” → „Proiect”.'});
  else chat.push({r:'a',t:'În prototip răspund doar la exemple. Încearcă: „mută butonul Dt/Kt la început” sau „scrie Proiect în loc de Grant”. În aplicație răspunsul vine de la modelul AI, cu acces la datele tale și la căutarea pe internet.'});
  renderChat();
}

/* ───────────── randare ───────────── */
let section='home';
function render(){
  document.getElementById('side').innerHTML = SECTIONS.map(([id,ico,t])=>
    `<div class="${section===id?'active':''}" onclick="section='${id}'; ${id==='home'?"active='home'":`openTab('sec-${id}','${t}')`}; render()"><span class="ico">${ico}</span><span class="t">${t}</span></div>`).join('');
  document.getElementById('tabs').innerHTML = tabs.map(t=>
    `<div class="tab ${t.id===active?'active':''}" onclick="active='${t.id}';render()">${t.fixed?'⌂ ':''}${t.title}${t.fixed?'':` <span class="x" onclick="closeTab('${t.id}',event)">×</span>`}</div>`).join('');
  const id=active;
  document.getElementById('main').innerHTML = id.startsWith('sec-') ? SCREENS.section(id.slice(4)) : (SCREENS[id]?SCREENS[id]():'');
}
render();
</script>
